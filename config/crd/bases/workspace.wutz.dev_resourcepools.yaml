---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: resourcepools.workspace.wutz.dev
spec:
  group: workspace.wutz.dev
  names:
    categories:
    - project
    kind: ResourcePool
    listKind: ResourcePoolList
    plural: resourcepools
    shortNames:
    - frp
    singular: resourcepool
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.totalNodes
      name: Nodes
      type: integer
    - jsonPath: .status.readyNodes
      name: ReadyNodes
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ResourcePool partitions cluster compute nodes into isolated Exclusive or
          Shared pools with Kueue ResourceFlavor integration, idle-node transfer guards,
          and pool-level operational policies.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ResourcePool
            properties:
              accessControl:
                description: accessControl controls which Projects can discover and
                  bind to this pool.
                properties:
                  allowedProjects:
                    description: allowedProjects lists Project names allowed to use
                      this pool when visibility is Restricted.
                    items:
                      type: string
                    type: array
                  visibility:
                    default: Public
                    description: visibility defaults to Public.
                    enum:
                    - Public
                    - Restricted
                    type: string
                type: object
              allowedWorkloads:
                description: |-
                  allowedWorkloads restricts which workload categories may run in this pool.
                  Defaults to all kinds for Exclusive pools and [Sandbox] for Shared pools.
                items:
                  description: WorkloadKind identifies a category of AI workload permitted
                    on a ResourcePool.
                  enum:
                  - Sandbox
                  - TrainJob
                  - Inference
                  type: string
                type: array
              displayName:
                description: displayName is shown in the UI.
                type: string
              mode:
                default: Exclusive
                description: mode selects Exclusive (whole GPU) or Shared (multiplexed
                  dev sandboxes). Defaults to Exclusive.
                enum:
                - Exclusive
                - Shared
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: |-
                  nodeSelector dynamically selects nodes matching these labels for this pool
                  when not explicitly assigned to another pool.
                type: object
              nodes:
                description: |-
                  nodes explicitly assigns nodes to this pool. Nodes not assigned to any
                  named pool belong to the built-in default pool.
                items:
                  type: string
                type: array
              rules:
                description: rules configures pool-level operational policies such
                  as idle shutdown.
                properties:
                  idleShutdown:
                    description: idleShutdown configures automatic release of idle
                      sandboxes in Exclusive pools.
                    properties:
                      countdownDuration:
                        description: countdownDuration is the grace period before
                          shutdown (0m, 15m, 30m, 45m or 60m).
                        type: string
                      enabled:
                        description: enabled turns on idle shutdown for all sandboxes
                          running in this pool.
                        type: boolean
                      idleDuration:
                        description: idleDuration is how long a sandbox must remain
                          idle before countdown begins.
                        type: string
                    type: object
                type: object
              sharing:
                description: sharing configures GPU multiplexing limits when mode
                  is Shared.
                properties:
                  maxInstancesPerNode:
                    default: 16
                    description: |-
                      maxInstancesPerNode limits how many shared interactive sandboxes may run
                      concurrently on a single node in this pool (e.g. 16 per 8-GPU node).
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              spotPolicy:
                description: spotPolicy configures idle lending to Spot queues when
                  mode is Exclusive.
                properties:
                  lendIdleToSpot:
                    description: |-
                      lendIdleToSpot allows idle GPUs in this pool to be borrowed by Spot queues
                      and reclaimed immediately when guaranteed workloads arrive.
                    type: boolean
                type: object
              zone:
                description: zone restricts membership to nodes in this availability
                  zone (topology.kubernetes.io/zone).
                type: string
            type: object
            x-kubernetes-validations:
            - message: Shared resource pools do not support idleShutdown rules
              rule: self.mode != 'Shared' || !has(self.rules) || !has(self.rules.idleShutdown)
                || !self.rules.idleShutdown.enabled
            - message: Shared resource pools cannot lend capacity to Spot
              rule: self.mode != 'Shared' || !has(self.spotPolicy) || !self.spotPolicy.lendIdleToSpot
            - message: Shared resource pools only allow Sandbox workloads
              rule: self.mode != 'Shared' || !has(self.allowedWorkloads) || self.allowedWorkloads.all(w,
                w == 'Sandbox')
          status:
            description: status defines the observed state of ResourcePool
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              gpus:
                description: gpus summarizes capacity per GPU class in this pool.
                items:
                  description: ResourcePoolGPUStatus summarizes GPU capacity of one
                    class in a ResourcePool.
                  properties:
                    allocated:
                      description: allocated GPUs currently requested by running pods.
                      format: int32
                      type: integer
                    class:
                      description: class is the normalized GPU class, e.g. h100-80gb
                        or rtx-5090.
                      type: string
                    free:
                      description: free GPUs available on schedulable nodes.
                      format: int32
                      type: integer
                    product:
                      description: product is the nvidia.com/gpu.product label value.
                      type: string
                    total:
                      description: total GPUs across schedulable nodes in the pool.
                      format: int32
                      type: integer
                  required:
                  - allocated
                  - class
                  - free
                  - product
                  - total
                  type: object
                type: array
              launchable:
                description: launchable reports fragmentation-aware launchable counts
                  per InstanceType.
                items:
                  description: |-
                    LaunchableInstanceType reports how many instances of a given InstanceType can
                    be scheduled immediately in this pool, accounting for per-node fragmentation.
                  properties:
                    count:
                      description: count is the number of instances that fit right
                        now.
                      format: int32
                      type: integer
                    instanceType:
                      description: instanceType is the InstanceType name, e.g. rtx-5090.x8
                        or rtx-5090.shared.
                      type: string
                  required:
                  - count
                  - instanceType
                  type: object
                type: array
              nodes:
                description: nodes reports node-level availability and transfer guard
                  status.
                items:
                  description: ResourcePoolNodeStatus reports per-node capacity and
                    transfer state.
                  properties:
                    allocatedGPUs:
                      format: int32
                      type: integer
                    freeGPUs:
                      format: int32
                      type: integer
                    maxSlots:
                      format: int32
                      type: integer
                    message:
                      type: string
                    node:
                      type: string
                    ready:
                      type: boolean
                    state:
                      description: NodePoolState describes a node's membership state
                        in a ResourcePool.
                      enum:
                      - Ready
                      - TransferBlocked
                      - ZoneMismatch
                      - NotFound
                      - Conflict
                      type: string
                    totalGPUs:
                      format: int32
                      type: integer
                    usedSlots:
                      format: int32
                      type: integer
                    zone:
                      type: string
                  required:
                  - node
                  - ready
                  - state
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              readyNodes:
                description: readyNodes is the number of schedulable, Ready nodes
                  in this pool.
                format: int32
                type: integer
              totalNodes:
                description: totalNodes is the number of nodes assigned to this pool.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: resource pool name must be a DNS label of at most 40 characters
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 40
    served: true
    storage: true
    subresources:
      status: {}
